name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version tag (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version
        id: ver
        shell: pwsh
        run: |
          if ('${{ github.event_name }}' -eq 'workflow_dispatch') {
            $v = '${{ github.event.inputs.version }}'
          } else {
            $v = '${{ github.ref_name }}'
          }
          if (-not $v) { throw 'Could not resolve version.' }
          "VERSION=$v" | Out-File -FilePath $env:GITHUB_ENV -Append
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release

      - name: Package executable
        shell: pwsh
        run: |
          Copy-Item build/WorldClock.exe WorldClock.exe
          Compress-Archive -Path WorldClock.exe -DestinationPath WorldClock-${env:VERSION}-windows-x64.zip -Force

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $notes = @"
          World Clock ${env:VERSION}

          Assets:
          - WorldClock.exe: compiled executable (run as-is, no installer)
          - WorldClock-${env:VERSION}-windows-x64.zip: zipped executable
          "@
          gh release view $env:VERSION *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $env:VERSION `
              WorldClock.exe `
              WorldClock-${env:VERSION}-windows-x64.zip `
              --title "World Clock ${env:VERSION}" `
              --notes $notes
          } else {
            gh release upload $env:VERSION `
              WorldClock.exe `
              WorldClock-${env:VERSION}-windows-x64.zip `
              --clobber
          }